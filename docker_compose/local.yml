services:

  orbit-postgres:
    image: postgres:17.9-bookworm
    container_name: orbit-postgres
    environment:
      POSTGRES_DB: soniks_orbit
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "soniks"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - orbit_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d soniks_orbit"]
      interval: 5s
      timeout: 3s
      retries: 3

  orbit-rabbitmq:
    image: rabbitmq:4.1.4-management
    container_name: orbit-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5673:5672"
    volumes:
      - orbit_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "pgrep beam || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  orbit-api:
    build: ../
    container_name: orbit-api
    env_file: ../.env
    command: "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      orbit-postgres:
        condition: service_healthy
      orbit-rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../src:/app/src
      - orbit_waterfalls:/var/cache/soniks-orbit/waterfalls
      - orbit_catalog:/var/cache/soniks-orbit/catalog
    healthcheck:
      # curl нет в облегчённом образе, поэтому проверяем стандартной urllib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  orbit-taskiq:
    build: ../
    container_name: orbit-taskiq
    env_file: ../.env
    command: "taskiq worker infrastructure.tasks.broker:broker infrastructure.tasks --reload"
    depends_on:
      orbit-postgres:
        condition: service_healthy
      orbit-rabbitmq:
        condition: service_healthy
    volumes:
      - ../src:/app/src
      # Кеши общие с API: водопады неизменяемы, каталог один на всех
      - orbit_waterfalls:/var/cache/soniks-orbit/waterfalls
      - orbit_catalog:/var/cache/soniks-orbit/catalog

  # Планировщик появился в фазе 6 вместе со сценарием (правило 12):
  # decisions/006 требует автомата, а не кнопки, и сканер обязан ходить сам.
  # Расписание стоит меткой на самой задаче (`LabelScheduleSource`), поэтому
  # держать его в согласии с кодом не нужно — оно и есть код.
  orbit-scheduler:
    build: ../
    container_name: orbit-scheduler
    env_file: ../.env
    command: "taskiq scheduler infrastructure.tasks.scheduler:scheduler"
    depends_on:
      orbit-rabbitmq:
        condition: service_healthy
    volumes:
      - ../src:/app/src

# Redis, MinIO, sqladmin, prometheus и OTLP из soniks-backend не берутся:
# под них нет сценария.
volumes:
  orbit_postgres_data:
  orbit_rabbitmq_data:
  orbit_waterfalls:
  orbit_catalog:
